name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"   # a new app or kit release turns the release check red until the pages follow

jobs:
  private-refs:
    name: No private references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: |
          if git grep -n -I -E '_archive|CLAUDE\.md|memcap|macEM-suite|setup-python-refs' -- ':!.gitignore' ':!.github/workflows/ci.yml'; then
            echo "Private references above; this repo is public."; exit 1
          fi

  site:
    name: Links and releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Internal links, versions and download sizes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/check_site.py

  docs:
    name: Documentation pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the generator's dependency
        run: python3 -m pip install -r tools/requirements.txt
      - name: Generator tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: docs/ is what docs-src gives
        run: python3 tools/build_docs.py --check
      - name: releases.atom is what the update feeds and the releases page give
        run: python3 tools/build_feed.py --check
